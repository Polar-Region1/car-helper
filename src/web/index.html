<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Helper — 智能选车助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Oswald:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="grain"></div>

<!-- Status Bar -->
<header class="status-bar">
  <div class="status-left">
    <span class="status-indicator" id="conn-indicator"></span>
    <span class="status-label" id="conn-text">CONNECTING</span>
    <span class="status-sep">|</span>
    <span class="status-item">MODEL: DEEPSEEK</span>
  </div>
  <div class="status-right">
    <span class="status-item" id="session-display">SESSION: --</span>
    <span class="status-sep">|</span>
    <span class="status-item" id="latency-display">-- ms</span>
  </div>
</header>

<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1 class="logo">CAR HELPER</h1>
      <p class="logo-sub">INTELLIGENT VEHICLE ADVISOR</p>
    </div>
    <div class="session-list" id="session-list">
      <!-- sessions injected here -->
    </div>
    <button class="new-session-btn" id="new-session-btn">
      <span class="btn-icon">+</span>
      <span class="btn-text">NEW SESSION</span>
    </button>
  </aside>

  <!-- Main Chat Area -->
  <main class="chat-area">
    <div class="messages" id="messages">
      <div class="welcome-message">
        <h2 class="welcome-title">智能选车助手</h2>
        <p class="welcome-desc">基于 40,000+ 车型知识图谱，通过自然语言帮你找到最合适的座驾。</p>
        <div class="suggestions">
          <button class="suggestion-chip" data-text="20万以内纯电SUV推荐">20万以内纯电SUV</button>
          <button class="suggestion-chip" data-text="比亚迪和特斯拉怎么选">比亚迪 vs 特斯拉</button>
          <button class="suggestion-chip" data-text="10万以内保养成本低的车">低保养成本车型</button>
          <button class="suggestion-chip" data-text="纯电动车续航最长的有哪些">续航最长纯电车</button>
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
      <div class="input-wrapper">
        <span class="input-prompt">></span>
        <textarea
          class="input-field"
          id="input-field"
          rows="1"
          placeholder="输入你的选车需求..."
          spellcheck="false"
        ></textarea>
        <button class="send-btn" id="send-btn" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <p class="input-hint">Enter 发送 / Shift+Enter 换行</p>
    </div>
  </main>
</div>

<script src="/static/app.js"></script>
</body>
</html>
